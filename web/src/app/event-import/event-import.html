<div class="page">
  <h1>Importer un événement</h1>
  <p class="subtitle">
    Crée un événement (ou choisis-en un existant) et indexe réellement les images fournies.
  </p>

  <form class="card import-form" (ngSubmit)="onSubmit()">
    <div class="mode-tabs">
      <button
        type="button"
        [class.active]="mode === 'new'"
        [disabled]="running()"
        (click)="selectMode('new')"
      >
        Nouvel événement
      </button>
      <button
        type="button"
        [class.active]="mode === 'existing'"
        [disabled]="running()"
        (click)="selectMode('existing')"
      >
        Événement existant
      </button>
    </div>

    @if (mode === 'new') {
      <fieldset class="event-fields">
        <legend>Nouvel événement</legend>
        <label>
          Description
          <input type="text" name="description" [(ngModel)]="newDescription" required />
        </label>
        <label>
          Date
          <input type="date" name="eventDate" [(ngModel)]="newEventDate" required />
        </label>
        <label>
          Adresse
          <input type="text" name="address" [(ngModel)]="newAddress" required />
        </label>
      </fieldset>
    } @else {
      <fieldset class="event-fields">
        <legend>Événement existant</legend>
        <label>
          Choisir un événement
          <select name="existingEvent" [(ngModel)]="selectedEventId">
            <option [ngValue]="null">— sélectionner —</option>
            @for (event of events(); track event.id) {
              <option [ngValue]="event.id">
                #{{ event.id }} — {{ event.description }} ({{ event.event_date }})
              </option>
            }
          </select>
        </label>
        <button type="button" class="btn btn--quiet btn--sm" (click)="refreshEvents()">
          Rafraîchir la liste
        </button>
      </fieldset>
    }

    <label class="file-field">
      Images à importer (plusieurs possibles)
      <input
        type="file"
        accept="image/*"
        multiple
        [disabled]="running()"
        (change)="onFilesSelected($event)"
        required
      />
      @if (selectedFiles().length > 0) {
        <span class="file-count">{{ selectedFiles().length }} fichier(s) sélectionné(s)</span>
      }
    </label>

    <button type="submit" class="btn btn--primary" [disabled]="running()">
      {{ running() ? 'Import en cours…' : 'Importer et indexer' }}
    </button>
  </form>

  @if (error()) {
    <p class="alert alert--error" role="alert">{{ error() }}</p>
  }

  @if (items().length > 0) {
    <app-import-progress
      [items]="items()"
      [running]="running()"
      [startedAt]="startedAt()"
      [finishedAt]="finishedAt()"
      [eventId]="resultEventId()"
      (cancelRequested)="cancelRun()"
    />
  }
</div>
