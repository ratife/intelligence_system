<article class="result">
  <div class="result-media">
    <app-face-frame
      [src]="match().evidence.image_url"
      [alt]="'Photo de : ' + match().title"
      [boxes]="boxes()"
    />
  </div>

  <div class="result-body">
    <h2>{{ match().title }}</h2>
    <p class="meta">{{ match().event_date }} — {{ match().address }}</p>

    <div class="evidence">
      <app-face-crop
        [src]="match().evidence.image_url"
        [bbox]="match().evidence.bbox"
        alt="Gros plan du visage reconnu"
      />
      <div class="evidence-scores">
        <p class="confidence">
          <b>{{ match().confidence | number: '1.2-2' }}</b>
          de confiance · {{ match().match_count }} visage(s)
        </p>
        <p class="similarity">
          Similarité du visage montré :
          {{ match().evidence.similarity | number: '1.2-2' }}
        </p>
      </div>
    </div>
  </div>
</article>
