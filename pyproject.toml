[project]
name = "facereco"
version = "0.1.0"
description = "Système de reconnaissance faciale événementielle (indexation & recherche)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "redis>=5.0",
    "boto3>=1.34",
    "onnxruntime>=1.18",
    "insightface>=0.7.3",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.3",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.18"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services (Postgres/Redis/MinIO)",
    "e2e: end-to-end tests through the FastAPI app",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["insightface.*", "boto3.*", "cv2.*", "pgvector.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
